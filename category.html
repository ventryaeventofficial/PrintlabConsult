<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/TitleBar-Logo2.png">
  <title>Projects | Printlab Consult</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .category-page-header {
      padding: 3rem 0 1.5rem;
      border-bottom: 1px solid #eee;
      margin-bottom: 2rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #666;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1.5rem;
      transition: color 0.2s ease;
    }
    .back-btn:hover {
      color: #25D366;
    }
    .pill-container {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .pill-btn {
      padding: 0.6rem 1.4rem;
      border-radius: 50px;
      border: 1px solid #e4e4e7;
      background: #f4f4f5;
      color: #18181b;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .pill-btn.active, .pill-btn:hover {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }
    /* Modal / Lightbox Styles */
    .project-card {
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
    }

    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 1.5rem;
    }
    .image-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .image-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
    }
    .image-modal-content {
      position: relative;
      z-index: 10;
      background: #ffffff;
      border-radius: 16px;
      max-width: 850px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .image-modal.active .image-modal-content {
      transform: scale(1);
    }
    .image-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .image-modal-close:hover {
      background: rgba(0, 0, 0, 0.9);
    }
    .image-modal-img-wrap {
      width: 100%;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 60vh;
      overflow: hidden;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .image-modal-img-wrap img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      display: block;
    }
    .image-modal-details {
      padding: 1.5rem 2rem 2rem;
    }
    .image-modal-details h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 0.5rem;
      color: #111;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header style="padding: 1.2rem 0; border-bottom: 1px solid #f0f0f0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="logo">
        <img src="/images/Printlab Logo.png" alt="Printlab Consult" style="height: 70px; " onerror="this.style.display='none'">
        <!-- <span style="font-weight: 700; font-size: 1.2rem; color: #111;">Printlab Consult</span> -->
      </a>
      <a href="index.html" class="back-btn" style="margin-bottom: 
      0; background-color: #690556; height: 3rem; width: 8rem; 
      border-radius: 50px; color: #e4e4e7;  justify-content: center;">
        <i data-lucide="arrow-left" style="width: 18px; "></i> Main Site
      </a>
    </div>
  </header>

  <!-- Category Projects Main Content -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 5rem;">
    
    <!-- Title Section -->
    <div class="category-page-header">
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
          <span style="color: #666; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">PORTFOLIO GALLERY</span>
         
          <h1 id="selectedCategoryTitle" style="font-size: 2.2rem; font-weight: 700; margin-top: 0.4rem; color: #111;">Loading Category...</h1>
         <span style="color: #666; font-size: 0.85rem; font-weight: 600;  letter-spacing: 1px;">
            Click on each item for a larger view
        </span>
        </div>
        <span id="projectCountBadge" style="color: #25D366; font-size: 1rem; font-weight: 600;">0 Items</span>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div id="categoryPills" class="pill-container">
      <!-- Category pills render dynamically -->
    </div>

    <!-- Projects Grid -->
    <div id="categoryProjectsGrid" class="projects-grid">
      <!-- Dynamic project cards render here -->
    </div>
  </main>

  <!-- Enlarged Image Modal -->
  <div id="imageModal" class="image-modal" aria-hidden="true">
    <div class="image-modal-overlay" id="modalOverlay"></div>
    <div class="image-modal-content">
      <button class="image-modal-close" id="closeModalBtn" aria-label="Close Preview">&times;</button>
      <div class="image-modal-img-wrap">
        <img id="modalImg" src="" alt="Enlarged Project View" />
      </div>
      <div class="image-modal-details">
        <span id="modalBadge" class="project-badge">Category</span>
        <h2 id="modalTitle">Project Title</h2>
        <p id="modalClient" class="client-name" style="margin-top: 0.4rem; font-weight: 600; color: #555;"></p>
        <p id="modalDesc" class="proj-desc" style="margin-top: 0.8rem; color: #666; line-height: 1.6;"></p>
      </div>
    </div>
  </div>

  <script src="category.js"></script>
</body>
</html>
