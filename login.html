<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - PrintLab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #111; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #1a1a1a; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #2a2a2a; }
    .login-card h2 { margin-bottom: 24px; color: #25D366; text-align: center; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
    .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 15px; outline: none; }
    .form-group input:focus { border-color: #25D366; }
    .btn-login { width: 100%; padding: 12px; background: #25D366; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn-login:hover { background: #1eb855; }
    .error-msg { color: #ff5252; font-size: 14px; margin-top: 15px; text-align: center; display: none; }
  </style>

  <!-- Firebase Web SDK (Compat version for standard script usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="login-card">
    <h2>PrintLab Admin</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="admin@printlab.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-login" id="login-btn">Log In</button>
      <div id="error-msg" class="error-msg"></div>
    </form>
  </div>

  <script>
    // YOUR FIREBASE WEB CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBc5AIvYXC3ts3IwDTSSEBRBETQDMOAGu0",
      authDomain: "printlab-consult.firebaseapp.com",
      projectId: "printlab-consult",
      storageBucket:"printlab-consult.firebasestorage.app",
      messagingSenderId: "548275857281",
      appId: "1:548275857281:web:0fb62e3e8ed2a2a4092a80"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Redirect if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = "admin.html";
      }
    });

    // Handle Login Submit
    const loginForm = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = "admin.html";
      } catch (error) {
        errorMsg.innerText = error.message.replace("Firebase: ", "");
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
